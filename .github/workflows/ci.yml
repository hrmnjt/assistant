# Runs the repository's own checks with fixture data only; no secrets are used.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests, build, and Cloudflare bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: .cache/npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci --cache ./.cache/npm --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npm run cloudflare:check

  browser:
    name: Browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: .cache/npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci --cache ./.cache/npm --ignore-scripts
      - run: npm run test:ui:install -- --with-deps
      - run: npm run test:ui
      - run: npm run test:browser
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: |
            .cache/ui-results
            .cache/ui-report
            .cache/tests/browser-results
          retention-days: 7
