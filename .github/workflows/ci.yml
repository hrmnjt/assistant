# Runs the repository's own checks with fixture data only, without secrets.
# Cloudflare's Workers Builds deploys main; require these checks on main so
# only a green pull request is merged.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push supersedes a pull request's run; runs on main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Typecheck, Worker bundle, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/cache@v4
        with:
          path: .cache/npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci --cache ./.cache/npm --ignore-scripts
      - run: npm run check
      - run: npm test

  browser:
    name: Browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/cache@v4
        with:
          path: .cache/npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci --cache ./.cache/npm --ignore-scripts
      - run: npm run test:ui:install -- --with-deps
      - run: npm run test:ui
      - run: npm run test:browser
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: |
            .cache/ui-results
            .cache/ui-report
            .cache/tests/browser-results
          retention-days: 7
