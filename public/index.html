<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>assistant</title>
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/vendor/basecoat-1.0.2/basecoat.min.css" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/theme.js"></script>
    <script src="/vendor/basecoat-1.0.2/basecoat.min.js" defer></script>
    <script src="/vendor/basecoat-1.0.2/sidebar.min.js" defer></script>
    <script type="module" src="/app.js"></script>
  </head>
  <body class="chat">
    <aside id="threads" class="sidebar">
      <nav aria-label="Chats">
        <header>
          <div class="bar">
            <h2>Chats</h2>
            <button id="close-threads" class="btn" data-variant="ghost" type="button">Close</button>
          </div>
          <a class="btn" href="/">New chat</a>
        </header>
        <section>
          <ul id="thread-list"></ul>
        </section>
        <footer>
          <a class="btn" data-variant="ghost" href="/admin">Admin</a>
        </footer>
      </nav>
    </aside>
    <section id="conversation">
      <header class="bar">
        <button id="open-threads" class="btn" data-variant="ghost" type="button">Chats</button>
        <h1 id="title">New chat</h1>
        <a class="btn" data-variant="ghost" href="/">New</a>
      </header>
      <main id="messages"></main>
      <p id="problem" class="error" role="alert" hidden></p>
      <form id="composer">
        <textarea class="textarea" name="text" rows="1" placeholder="Message" aria-label="Message" required></textarea>
        <button class="btn">Send</button>
      </form>
      <p id="settings">
        <select id="chat-model" aria-label="Model in this chat">
          <option value="">default</option>
        </select>
        · reasoning:
        <select id="chat-reasoning" aria-label="Reasoning in this chat">
          <option value="">default</option>
          <option>none</option>
          <option>minimal</option>
          <option>low</option>
          <option>medium</option>
          <option>high</option>
          <option>xhigh</option>
          <option>max</option>
        </select>
      </p>
    </section>
  </body>
</html>
